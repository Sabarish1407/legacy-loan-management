spring:
  datasource:
    url: jdbc:h2:mem:loan_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

loan:
  credit-bureau:
    url: http://localhost:${wiremock.server.port:8089}/credit-bureau/score
    timeout-ms: 2000
    retry-attempts: 2
    retry-backoff-ms: 100

logging:
  level:
    root: WARN
    com.neura.loanmanagement: INFO
    org.springframework.web: WARN

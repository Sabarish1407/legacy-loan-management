spring:
  application:
    name: legacy-loan-management
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:loan_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    error:
      include-binding-errors: always

      include-message: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

loan:
  eligibility:
    min-credit-score: 600
    min-monthly-income: 25000.00
    max-emi-to-income-ratio: 0.50
    max-total-exposure-ratio: 10.0
  credit-bureau:
    url: http://localhost:${wiremock.server.port:8089}/credit-bureau/score
    timeout-ms: 2000
    retry-attempts: 2
    retry-backoff-ms: 100
  payment-gateway:
    simulation-mode: SUCCESS
    timeout-ms: 2000

spring:
  datasource:
    url: jdbc:h2:mem:loan_demo_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

loan:
  credit-bureau:
    url: http://localhost:8089/credit-bureau/score
    timeout-ms: 2000
    retry-attempts: 1
    retry-backoff-ms: 100
  payment-gateway:
    simulation-mode: SUCCESS
    timeout-ms: 2000

logging:
  level:
    root: INFO
    com.neura.loanmanagement: INFO

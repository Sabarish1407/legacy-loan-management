name: CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Application
        run: mvn clean compile -B

      - name: Run Unit Tests
        run: mvn test -Dtest="com.neura.loanmanagement.unit.*Test" -B

      - name: Run Contract Tests
        run: mvn test -Dtest="ContractVerifierTest" -B

      - name: Run Security Tests
        run: mvn test -Dtest="com.neura.loanmanagement.security.*Test" -B

      - name: Run Integration Tests
        run: mvn verify -Dtest="none" -Dit.test="*IT" -B

      - name: Full Verification & Code Coverage (JaCoCo)
        run: mvn clean verify -B

      - name: Publish Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-failsafe-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Publish JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

# Generated by Central Neuro (neuro-deploy). TrueCD steps 1-3, 5, 6 and the image build.
# Step 4 (contract) compares with the base branch and runs in the agent.
name: TrueCD
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag for the image (the agent passes the commit SHA)
        required: false
        default: ''
      ref:
        description: Branch to build (the agent passes its neuro/* branch; empty = the branch the workflow was started on)
        required: false
        default: ''
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  toolchain:
    name: 1 Toolchain onboarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -DskipTests test-compile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-reports
          path: |
            target/classes
          if-no-files-found: warn
  unit:
    name: 2 Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp test -Dmaven.test.failure.ignore=true jacoco:report "-Dgroups=!neuro-component & !neuro-integration & !neuro-e2e & !neuro-contract & !neuro-performance & !neuro-acceptance & !neuro-security & !neuro-post-deploy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: warn
  component:
    name: 3 Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp test -Dmaven.test.failure.ignore=true -Dgroups=neuro-component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-reports
          path: |
            target/surefire-reports
          if-no-files-found: warn
  integration:
    name: 5 Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp test -Dmaven.test.failure.ignore=true -Dgroups=neuro-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: |
            target/surefire-reports
          if-no-files-found: warn
  security:
    name: 6 Security
    # after the unit job, which saves the Maven cache for this pom: Trivy then reads dependency poms locally instead of
    # asking Maven Central, which rate-limits the shared runner addresses (HTTP 429). Runs even if the unit job failed.
    needs: [unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Secrets (Gitleaks)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --report-format json --report-path /repo/gitleaks.json --no-banner
      - name: Code (Semgrep)
        if: always()
        run: |
          # this generated workflow is reviewed when it is merged; a branch can carry an older copy that the agent may not update
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config auto --error --severity ERROR --exclude .github/workflows/truecd.yml --json --output /src/semgrep.json /src
      - name: Dependencies and configuration (Trivy)
        if: always()
        run: |
          # the cached Maven repository lets Trivy read dependency poms locally: Maven Central rate-limits the shared runner addresses (HTTP 429)
          docker run --rm -v "$PWD:/work" -v "$HOME/.m2:/root/.m2" aquasec/trivy:latest fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output /work/trivy.json /work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            gitleaks.json
            semgrep.json
            trivy.json
          if-no-files-found: warn
  image:
    name: Image
    needs: [toolchain, unit, component, integration, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -DskipTests package
      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: echo "value=${INPUT_TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/sabarish1407/legacy-loan-management:${{ steps.tag.outputs.value }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Scan the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 ghcr.io/sabarish1407/legacy-loan-management:${{ steps.tag.outputs.value }}
      - name: Push to GHCR
        run: docker push ghcr.io/sabarish1407/legacy-loan-management:${{ steps.tag.outputs.value }}

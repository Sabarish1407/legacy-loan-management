  security:
    name: 6 Security
    # after the unit job, which saves the Maven cache for this pom: Trivy then reads dependency poms locally instead of
    # asking Maven Central, which rate-limits the shared runner addresses (HTTP 429). Runs even if the unit job failed.
    needs: [unit]
    if: ${{ !cancelled() }}
    # the original's known findings (often the reason for the ticket) are recorded in the reports, never a reason to skip its image
    continue-on-error: ${{ inputs.original == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Read the project (Java version, Maven wrapper, JaCoCo)
        id: project
        run: |
          v='\(1\.\)\{0,1\}\([0-9][0-9]*\)'
          java=$(sed -n "s:.*<java.version>$v</java.version>.*:\2:p" pom.xml | head -1)
          [ -n "$java" ] || java=$(sed -n "s:.*<maven.compiler.release>$v</maven.compiler.release>.*:\2:p" pom.xml | head -1)
          [ -n "$java" ] || java=$(sed -n "s:.*<maven.compiler.source>$v</maven.compiler.source>.*:\2:p" pom.xml | head -1)

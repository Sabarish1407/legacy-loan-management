          echo "Java $java, $real, JaCoCo agent from: $jacoco"
          { echo "java=$java"; echo "mvn=$RUNNER_TEMP/neuro-mvn"; echo "jacoco=$jacoco"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}
          cache: maven
      - name: Toolchain (the exact Java and Maven this job uses)
        run: |
          java -version
          "$MVN" -v
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - name: Unit tests with coverage
        run: |
          # a pom that binds JaCoCo's agent itself must not get a second one: two agents crash the test JVM
          if [ "$JACOCO" = pom ]; then before=""; report="jacoco:report"; else before="org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent"; report="org.jacoco:jacoco-maven-plugin:0.8.12:report"; fi
          $MVN -B -ntp $before test -Dmaven.test.failure.ignore=true $report "-Dgroups=!neuro-component & !neuro-integration & !neuro-e2e & !neuro-contract & !neuro-performance & !neuro-acceptance & !neuro-security & !neuro-post-deploy"
        env:
          MVN: ${{ steps.project.outputs.mvn }}
          JACOCO: ${{ steps.project.outputs.jacoco }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            **/target/surefire-reports
            **/target/site/jacoco
          if-no-files-found: warn

            "$real" -Dmaven.resolver.transport=wagon "$@"
            code=$?
          fi
          exit "$code"
          WRAPPER
          } > "$RUNNER_TEMP/neuro-mvn"
          chmod +x "$RUNNER_TEMP/neuro-mvn"
          echo "Java $java, $real, JaCoCo agent from: $jacoco"
          { echo "java=$java"; echo "mvn=$RUNNER_TEMP/neuro-mvn"; echo "jacoco=$jacoco"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}
          cache: maven
      - name: Toolchain (the exact Java and Maven this job uses)
        run: |
          java -version
          "$MVN" -v
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - name: Image name and tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          echo "value=${INPUT_TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image (the project's Dockerfile, or Spring Boot buildpacks when it has none)
        run: |
          if [ -f Dockerfile ]; then
            $MVN -B -ntp -Dmaven.test.skip=true package
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$IMAGE" .
          else
            echo "No Dockerfile: building with Spring Boot buildpacks"
            $MVN -B -ntp -Dmaven.test.skip=true spring-boot:build-image "-Dspring-boot.build-image.imageName=$IMAGE"
          fi
        env:
          MVN: ${{ steps.project.outputs.mvn }}
          IMAGE: ${{ steps.tag.outputs.name }}:${{ steps.tag.outputs.value }}
      - name: Scan the image (Trivy)
        continue-on-error: ${{ inputs.original == 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
        env:
          IMAGE: ${{ steps.tag.outputs.name }}:${{ steps.tag.outputs.value }}
      - name: Push to GHCR
        run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.tag.outputs.name }}:${{ steps.tag.outputs.value }}

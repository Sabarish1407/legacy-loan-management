# Generated by Central Neuro (neuro-deploy). The same file for every repository: TrueCD steps 1-3, 5, 6 and the image build.
# Each job reads the project at run time (Java version, Maven wrapper, JaCoCo, Dockerfile). Step 4 (contract) runs in the agent.
name: TrueCD
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag for the image (the agent passes the commit SHA)
        required: false
        default: ''
      ref:
        description: Branch to build (the agent passes its neuro/* branch; empty = the branch the workflow was started on)
        required: false
        default: ''
      original:
        description: "'true' when the agent builds the ORIGINAL it compares a change with: security findings are recorded, not blocking the image"
        required: false
        default: ''
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  toolchain:
    name: 1 Toolchain onboarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Read the project (Java version, Maven wrapper, JaCoCo)
        id: project
        run: |
          v='\(1\.\)\{0,1\}\([0-9][0-9]*\)'
          java=$(sed -n "s:.*<java.version>$v</java.version>.*:\2:p" pom.xml | head -1)
          [ -n "$java" ] || java=$(sed -n "s:.*<maven.compiler.release>$v</maven.compiler.release>.*:\2:p" pom.xml | head -1)
          [ -n "$java" ] || java=$(sed -n "s:.*<maven.compiler.source>$v</maven.compiler.source>.*:\2:p" pom.xml | head -1)
          [ -n "$java" ] || { java=21; echo "::warning::No Java version in pom.xml; building with 21"; }
          if [ -f mvnw ]; then chmod +x mvnw; real=./mvnw; else real=mvn; fi
          if grep -q '<goal>prepare-agent</goal>' pom.xml; then jacoco=pom; else jacoco=agent; fi
          # every Maven call goes through this wrapper. Only when Maven ITSELF crashes with the class-loader clash in its HTTP
          # transport (seen on GitHub's runner with a build extension that brings its own HTTP client) is the same command run
          # once more with Maven's wagon transport; every other failure is left exactly as it is.
          {
            echo '#!/usr/bin/env bash'
            echo "real='$real'"
            cat <<'WRAPPER'
          log=$(mktemp)
          "$real" "$@" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q 'ClassCastException.*AuthCache' "$log"; then
            echo "::warning::Maven's HTTP transport crashed (class-loader clash); running the same command again with -Dmaven.resolver.transport=wagon"
            "$real" -Dmaven.resolver.transport=wagon "$@"
            code=$?
          fi
          exit "$code"
          WRAPPER
          } > "$RUNNER_TEMP/neuro-mvn"
          chmod +x "$RUNNER_TEMP/neuro-mvn"
          echo "Java $java, $real, JaCoCo agent from: $jacoco"
          { echo "java=$java"; echo "mvn=$RUNNER_TEMP/neuro-mvn"; echo "jacoco=$jacoco"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}
          cache: maven
      - name: Toolchain (the exact Java and Maven this job uses)
        run: |
          java -version
          "$MVN" -v
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - run: $MVN -B -ntp -DskipTests test-compile
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-reports
          path: |
            **/target/classes
          if-no-files-found: warn
  unit:
    name: 2 Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

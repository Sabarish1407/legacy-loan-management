      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}
          cache: maven
      - name: Toolchain (the exact Java and Maven this job uses)
        run: |
          java -version
          "$MVN" -v
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - run: $MVN -B -ntp test -Dmaven.test.failure.ignore=true -Dgroups=neuro-component
        env:
          MVN: ${{ steps.project.outputs.mvn }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-reports
          path: |
            **/target/surefire-reports
          if-no-files-found: warn
  integration:
    name: 5 Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Read the project (Java version, Maven wrapper, JaCoCo)
